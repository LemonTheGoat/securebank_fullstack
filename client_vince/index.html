<!DOCTYPE html><html lang="en" class="h-full"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Sign in · SecureBank</title><link rel="stylesheet" href="/css/app.css" /></head>
<body class="h-full flex items-center justify-center bg-[#f5f6f8] p-4"><main class="w-full max-w-md animate-float-up"><div class="text-center mb-8"><div class="inline-flex w-12 h-12 rounded-xl bg-slate-900 items-center justify-center text-white text-xl font-bold mb-4">SB</div><h1 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome back</h1><p class="text-sm text-slate-500 mt-2">Sign in to your SecureBank account</p></div><form id="loginForm" class="app-card p-8 space-y-5" novalidate><div><label for="email" class="app-label">Email address</label><input id="email" type="email" required class="app-input" placeholder="you@example.com" /></div><div><label for="password" class="app-label">Password</label><input id="password" type="password" required class="app-input" placeholder="••••••••" /></div><button type="submit" class="btn-primary w-full mt-2">Sign in</button><p id="msg" role="status" class="text-sm text-center text-rose-500"></p></form><p class="text-center text-sm text-slate-500 mt-6">No account? <a href="/register.html" class="text-indigo-600 font-medium hover:underline">Create one</a></p></main><script type="module" src="/src/js/auth.js"></script></body></html>
