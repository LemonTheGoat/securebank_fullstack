<!DOCTYPE html><html lang="en" class="h-full"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Register · SecureBank</title><link rel="stylesheet" href="/css/app.css" /></head>
<body class="h-full flex items-center justify-center bg-[#f5f6f8] p-4"><main class="w-full max-w-md animate-float-up"><div class="text-center mb-8"><h1 class="text-2xl font-bold text-slate-900 tracking-tight">Create account</h1><p class="text-sm text-slate-500 mt-2">Join SecureBank in 30 seconds</p></div><form id="registerForm" class="app-card p-8 space-y-4"><div><label for="fullName" class="app-label">Full name</label><input id="fullName" required class="app-input" placeholder="Jane Doe" /></div><div><label for="email" class="app-label">Email</label><input id="email" type="email" required class="app-input" placeholder="you@example.com" /></div><div><label for="phone" class="app-label">Phone (optional)</label><input id="phone" class="app-input" placeholder="+63 900 000 0000" /></div><div><label for="password" class="app-label">Password</label><input id="password" type="password" required minlength="8" class="app-input" placeholder="••••••••" /><p class="text-xs text-slate-500 mt-2">8+ chars · 1 uppercase · 1 lowercase · 1 digit</p></div><button type="submit" class="btn-primary w-full mt-2">Create account</button><p id="msg" role="status" class="text-sm text-center"></p></form><p class="text-center text-sm text-slate-500 mt-6">Have an account? <a href="/" class="text-indigo-600 font-medium hover:underline">Sign in</a></p></main><script type="module" src="/src/js/register.js"></script></body></html>
